services:
  backend:
    image: rishabhraj7/mern-blog-backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
    - ./backend/.env
    networks:
      - blog-net

  frontend:
    image: rishabhraj7/mern-blog-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      - backend
    networks:
      - blog-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - blog-net

volumes:
  mongo-data:

networks:
  blog-net:
    driver: bridge
